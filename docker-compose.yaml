# Coolify "Docker Compose" build pack. Variables written as ${NAME} show up in
# Coolify → Environment Variables. SERVICE_* variables are generated by Coolify.
services:
  app:
    build: .
    restart: unless-stopped
    environment:
      SERVICE_FQDN_APP_8080: ''
      AUTORUN_ENABLED: 'true'
      AUTORUN_LARAVEL_MIGRATION: 'true'
      APP_NAME: 'Maliyyə'
      APP_ENV: production
      APP_DEBUG: 'false'
      APP_KEY: ${APP_KEY}
      APP_URL: ${SERVICE_FQDN_APP}
      APP_LOCALE: az
      APP_FALLBACK_LOCALE: az
      LOG_CHANNEL: stderr
      LOG_LEVEL: warning
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: '5432'
      DB_DATABASE: expenses
      DB_USERNAME: ${SERVICE_USER_POSTGRES}
      DB_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      SESSION_DRIVER: database
      SESSION_LIFETIME: '1440'
      SESSION_SECURE_COOKIE: 'true'
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      MAIL_MAILER: log
      FORTIFY_REGISTRATION: 'false'
      FINANCE_TIMEZONE: Asia/Baku
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: ${SERVICE_FQDN_APP}
    volumes:
      - storage:/var/www/html/storage
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '--fail', 'http://127.0.0.1:8080/up']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  worker:
    build: .
    restart: unless-stopped
    command: ['php', '/var/www/html/artisan', 'queue:work', '--sleep=3', '--tries=3', '--max-time=3600']
    stop_signal: SIGTERM
    environment:
      AUTORUN_ENABLED: 'false'
      APP_ENV: production
      APP_DEBUG: 'false'
      APP_KEY: ${APP_KEY}
      APP_URL: ${SERVICE_FQDN_APP}
      APP_LOCALE: az
      LOG_CHANNEL: stderr
      LOG_LEVEL: warning
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: '5432'
      DB_DATABASE: expenses
      DB_USERNAME: ${SERVICE_USER_POSTGRES}
      DB_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      MAIL_MAILER: log
      FINANCE_TIMEZONE: Asia/Baku
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: ${SERVICE_FQDN_APP}
    volumes:
      - storage:/var/www/html/storage
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'healthcheck-queue']
      start_period: 10s

  scheduler:
    build: .
    restart: unless-stopped
    command: ['php', '/var/www/html/artisan', 'schedule:work']
    stop_signal: SIGTERM
    environment:
      AUTORUN_ENABLED: 'false'
      APP_ENV: production
      APP_DEBUG: 'false'
      APP_KEY: ${APP_KEY}
      APP_URL: ${SERVICE_FQDN_APP}
      APP_LOCALE: az
      LOG_CHANNEL: stderr
      LOG_LEVEL: warning
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: '5432'
      DB_DATABASE: expenses
      DB_USERNAME: ${SERVICE_USER_POSTGRES}
      DB_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      MAIL_MAILER: log
      FINANCE_TIMEZONE: Asia/Baku
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: ${SERVICE_FQDN_APP}
    volumes:
      - storage:/var/www/html/storage
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'healthcheck-schedule']
      start_period: 10s

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${SERVICE_USER_POSTGRES}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      POSTGRES_DB: expenses
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d expenses']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  storage:
  postgres-data:
