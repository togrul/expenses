<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#09090b">
<title>Offline · Maliyyə</title>
<style>
    html, body { margin: 0; height: 100%; background: #09090b; color: #f4f4f5; font-family: -apple-system, BlinkMacSystemFont, 'Satoshi', system-ui, sans-serif; }
    main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 24px; text-align: center; box-sizing: border-box;
        background: radial-gradient(60% 40% at 50% 0%, rgba(217,184,119,.10), transparent 70%); }
    .logo { width: 64px; height: 64px; border-radius: 18px; background: linear-gradient(135deg,#ecd8a6,#d4b06a,#a8823d); display: flex; align-items: center; justify-content: center; margin-bottom: 8px; }
    h1 { font-size: 20px; margin: 0; font-weight: 600; letter-spacing: -0.01em; }
    p { margin: 0; color: #a1a1aa; font-size: 15px; max-width: 280px; line-height: 1.45; }
    button { margin-top: 10px; border: 0; border-radius: 14px; padding: 13px 22px; font: inherit; font-weight: 600; font-size: 15px; background: #f4f4f5; color: #09090b; cursor: pointer; }
</style>
</head>
<body>
<main>
    <div class="logo">
        <svg width="34" height="34" viewBox="0 0 32 32" fill="none"><path d="M9 22.5V14.2a7 7 0 0 1 14 0v8.3" stroke="#141210" stroke-width="2.6" stroke-linecap="round"/><path d="M16 7.5v15" stroke="#141210" stroke-width="2.6" stroke-linecap="round"/><path d="M7 25.5h18" stroke="#141210" stroke-width="2.6" stroke-linecap="round"/></svg>
    </div>
    <h1>İnternet bağlantısı yoxdur</h1>
    <p>Rəqəmlər həmişə serverdən təzə gəlir. Bağlantı bərpa olunanda yenidən yoxlayın.</p>
    <button type="button" onclick="location.reload()">Yenidən yoxla</button>
</main>
<script>window.addEventListener('online', () => location.reload());</script>
</body>
</html>
